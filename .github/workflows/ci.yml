name: FraudDNA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Ruff Lint & Format Check
        run: |
          ruff check backend
          ruff format --check backend

      - name: Mypy Type Check
        run: |
          mypy backend/app

      - name: Run Backend Tests
        run: |
          pytest backend/tests -v --tb=short

      - name: Build & Verify Production Docker Image
        run: |
          docker build -t frauddna-backend:prod -f backend/Dockerfile .
          echo "Verifying ML and application artifacts in container..."
          docker run --rm frauddna-backend:prod ls -la /app/app
          docker run --rm frauddna-backend:prod ls -la /app/ml/data/transactions.csv
          docker run --rm frauddna-backend:prod ls -la /app/ml/models/lightgbm_model.joblib
          docker run --rm frauddna-backend:prod ls -la /app/ml/models/feature_pipeline.joblib
          docker run --rm frauddna-backend:prod python -c "from app.graph.service import get_graph_service; gs = get_graph_service(); gs.initialize(); print('SUCCESS: GraphService initialized inside container with', len(gs.graph.nodes), 'nodes')"

  frontend-checks:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npm run type-check

      - name: Next.js Production Build
        working-directory: ./frontend
        run: npm run build
