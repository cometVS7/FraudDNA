services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: frauddna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frauddna_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frauddna_password}
      POSTGRES_DB: ${POSTGRES_DB:-frauddna_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frauddna_user} -d ${POSTGRES_DB:-frauddna_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frauddna_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-frauddna_user}:${POSTGRES_PASSWORD:-frauddna_password}@postgres:5432/${POSTGRES_DB:-frauddna_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-frauddna_user}:${POSTGRES_PASSWORD:-frauddna_password}@postgres:5432/${POSTGRES_DB:-frauddna_db}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frauddna_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
